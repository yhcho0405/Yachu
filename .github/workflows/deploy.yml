name: Verify and deploy Dice Atelier
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: dice-atelier-${{ github.event_name == 'push' && 'production' || github.ref }}
  cancel-in-progress: false
jobs:
  verify-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox
      - name: Build client and Worker without production credentials
        run: npm run build && npm run build:worker
      - name: Real local Workers and Durable Objects browser verification
        id: local_browser
        run: npm run test:e2e
      - name: Verify durable recovery after a real workerd restart
        id: persistence
        run: npm run test:persistence
      - name: Keep local verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-browser-results-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            work/local-diagnostics.jsonl
            work/local-runtime-stack.txt
          retention-days: 7
      - name: Confirm this is still the newest main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_sha" = "$GITHUB_SHA"
      - name: Deploy verified commit and runtime secret together
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: node scripts/deploy.mjs
      - name: Verify live revision and real 1–4 player games
        id: live_browser
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:e2e
      - name: Keep production verification evidence
        if: always() && github.event_name == 'push' && env.PLAYWRIGHT_BASE_URL != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-browser-results-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Record verification result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          LOCAL_BROWSER: ${{ steps.local_browser.outcome }}
          PERSISTENCE: ${{ steps.persistence.outcome }}
          LIVE_BROWSER: ${{ steps.live_browser.outcome }}
        run: |
          node scripts/summary.mjs
